name: BuildRaice
version: '${version}'
main: com.jessiessi.buildraice.BuildRaicePlugin
api-version: '26.3'
description: Flache Bauwelt mit 32x32-Plots im Creative
author: JessiEssi
commands:
  plot:
    description: Zu deinem Plot teleportieren oder Plot-Infos anzeigen
    usage: /plot [info]
  build:
    description: Holt alle aus der Box und startet die Runde mit Wänden und Bossbar
    usage: /build <Gegenstand> <Minuten>
    permission: buildraice.build
  ende:
    description: Beendet das Spiel und veröffentlicht die Bestenliste
    usage: /ende
    permission: buildraice.ende
  bestenliste:
    description: Zeigt die Gesamtpunkte aller Runden
    usage: /bestenliste
  spectate:
    description: Nur zuschauen statt mitspielen, bis du /spectate erneut eingibst
    usage: /spectate
  skip:
    description: Überspringt den gerade bewerteten Plot
    usage: /skip
    permission: buildraice.skip
permissions:
  buildraice.build:
    default: op
  buildraice.ende:
    default: op
  buildraice.skip:
    default: op
